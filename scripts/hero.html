<!doctype html>
<!-- The README's hero image: a MacBook Pro with the desktop's first screen, an iPhone 14 Pro in front with the phone's.
     scripts/screenshot.sh opens it with ?theme=light|dark&desk=<png>&phone=<png>&bg=<hex> and shoots it on a transparent background.
     Device frames: Devices.css (MIT, github.com/picturepan2/devices.css), vendored in scripts/vendor. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hero</title>
<link rel="stylesheet" href="vendor/devices.min.css">
<style>
  html, body { margin: 0; background: transparent; }
  :root { --ink: #10181f; }
  :root.dark { --ink: #f2f5f8; }
  /* 40 px of room on every side for the shadows; screenshot.sh trims the empty edges */
  .stage { position: relative; width: 856px; height: 540px; }
  /* the laptop behind, at its native Devices.css size (screen 600 × 375, the desktop's 16:10) */
  .laptop { position: absolute; left: 40px; top: 40px; filter: drop-shadow(0 16px 20px rgba(10, 20, 30, .14)); }
  .laptop .device-screen { object-position: top left; }
  /* the phone in front, over the laptop's lower right, at the same zoom as the laptop's screen
     (390 px of page in 187 px, 1440 in 600): the wrapper places it, zoom sizes it and keeps it sharp */
  .phone-at { position: absolute; z-index: 2; left: 611px; top: 75px; width: 205.44px; height: 416.64px; filter: drop-shadow(0 22px 26px rgba(10, 20, 30, .26)); }
  .phone { zoom: .48; }
  .phone .device-screen { overflow: hidden; background: var(--bg, #f4f6f8); }
  .phone .device-screen img { width: 390px; height: auto; display: block; }
  /* iOS status bar, so the page starts below the Dynamic Island as it does on a real phone */
  .status { height: 54px; display: flex !important; align-items: center; justify-content: space-between; padding: 6px 34px 0 50px;
    font: 600 17px/1 -apple-system, "SF Pro Text", system-ui, sans-serif; color: var(--ink); letter-spacing: -.01em; }
  .status .icons { display: flex !important; gap: 6px; align-items: center; }
  .status svg { display: block; fill: currentColor; }
</style>
</head>
<body>
<div class="stage">
  <div class="device device-macbook-pro laptop">
    <div class="device-frame"><img class="device-screen" id="desk" alt=""></div>
    <div class="device-stripe"></div>
    <div class="device-header"></div>
    <div class="device-sensors"></div>
    <div class="device-btns"></div>
    <div class="device-power"></div>
  </div>
  <div class="phone-at"><div class="device device-iphone-14-pro device-black phone">
    <div class="device-frame">
      <div class="device-screen">
        <div class="status"><span>9:41</span><span class="icons">
          <svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><path d="M8 2.6c2.3 0 4.4.9 6 2.4l1.2-1.2A10.2 10.2 0 0 0 8 .9C5.2.9 2.7 2 .8 3.8L2 5c1.6-1.5 3.7-2.4 6-2.4Zm0 3.5c1.3 0 2.5.5 3.5 1.3l1.2-1.2A6.7 6.7 0 0 0 8 4.4c-1.8 0-3.4.7-4.7 1.8l1.2 1.2c1-.8 2.2-1.3 3.5-1.3Zm0 3.4c-.6 0-1.1.2-1.5.6L8 11.6l1.5-1.5c-.4-.4-.9-.6-1.5-.6Z"/></svg>
          <svg width="27" height="13" viewBox="0 0 27 13" aria-hidden="true"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" stroke-opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" fill-opacity=".45"/></svg>
        </span></div>
        <img id="phone" alt="">
      </div>
    </div>
    <div class="device-stripe"></div>
    <div class="device-header"></div>
    <div class="device-sensors"></div>
    <div class="device-btns"></div>
    <div class="device-power"></div>
  </div></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('theme') === 'dark') document.documentElement.classList.add('dark');
  if (q.get('bg')) document.documentElement.style.setProperty('--bg', q.get('bg'));
  document.getElementById('desk').src = q.get('desk') || '';
  document.getElementById('phone').src = q.get('phone') || '';
  // scripts/screenshot.mjs waits for this instead of the dashboard's checks
  window.__shotReady = () => [...document.images].every(i => i.complete && i.naturalWidth > 0) && document.fonts.status === 'loaded';
</script>
</body>
</html>
