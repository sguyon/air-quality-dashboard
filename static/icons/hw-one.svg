<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2=".35" y2="1"><stop offset="0" stop-color="#fbfbfc"/><stop offset="1" stop-color="#e9ebee"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d5d9de"/><stop offset="1" stop-color="#bfc5cc"/></linearGradient>
    <linearGradient id="oled" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14171c"/><stop offset="1" stop-color="#05070a"/></linearGradient>
    <radialGradient id="sh" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#0f172a" stop-opacity=".22"/><stop offset="1" stop-color="#0f172a" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="24" cy="42.6" rx="18" ry="2.4" fill="url(#sh)"/>
  <!-- thickness: the side band with vent slots -->
  <rect x="5" y="8.5" width="38" height="33" rx="8" fill="url(#edge)"/>
  <g fill="#aab1b9"><rect x="11" y="38.6" width="5" height=".9" rx=".45"/><rect x="18.5" y="38.6" width="5" height=".9" rx=".45"/><rect x="26" y="38.6" width="5" height=".9" rx=".45"/><rect x="33.5" y="38.6" width="4" height=".9" rx=".45"/></g>
  <!-- the face -->
  <rect x="5" y="5.5" width="38" height="32.5" rx="8" fill="url(#face)" stroke="#d3d8de" stroke-width=".6"/>
  <path d="M12.5 6.25h23a7.4 7.4 0 0 1 4.6 1.6" stroke="#ffffff" stroke-width=".7" stroke-linecap="round" fill="none" opacity=".8"/>
  <!-- 11 RGB LEDs, from green to amber -->
  <g>
    <circle cx="11.6" cy="11.6" r="1.05" fill="#22c55e"/><circle cx="14.1" cy="11.6" r="1.05" fill="#22c55e"/><circle cx="16.6" cy="11.6" r="1.05" fill="#2fc95b"/>
    <circle cx="19.1" cy="11.6" r="1.05" fill="#4ccf55"/><circle cx="21.6" cy="11.6" r="1.05" fill="#74d34c"/><circle cx="24.1" cy="11.6" r="1.05" fill="#a3d642"/>
    <circle cx="26.6" cy="11.6" r="1.05" fill="#cdd23a"/><circle cx="29.1" cy="11.6" r="1.05" fill="#f2c537"/><circle cx="31.6" cy="11.6" r="1.05" fill="#f6ab35"/>
    <circle cx="34.1" cy="11.6" r="1.05" fill="#f59234"/><circle cx="36.6" cy="11.6" r="1.05" fill="#d9dde2"/>
  </g>
  <g fill="#ffffff" opacity=".55"><circle cx="11.3" cy="11.2" r=".3"/><circle cx="19.0" cy="11.2" r=".3"/><circle cx="26.5" cy="11.2" r=".3"/><circle cx="34.0" cy="11.2" r=".3"/></g>
  <!-- OLED display, a little larger than the real one -->
  <rect x="23.5" y="17" width="14.5" height="9.6" rx="1.2" fill="url(#oled)" stroke="#2a2f37" stroke-width=".5"/>
  <g fill="#eef3f8">
    <rect x="25" y="18.8" width="7.6" height="1" rx=".35"/><rect x="25" y="20.8" width="5.6" height="1" rx=".35"/>
    <rect x="25" y="22.8" width="6.8" height="1" rx=".35"/><rect x="25" y="24.6" width="4.8" height=".8" rx=".35" opacity=".7"/>
  </g>
  <rect x="33.8" y="18.8" width="2.6" height="1" rx=".35" fill="#7fd3e6"/>
  <!-- logo -->
  <g fill="none" stroke="#8d949c" stroke-linecap="round"><path d="M11.61 31.70A1.67 1.67 0 1 0 11.61 34.52" stroke-width="0.41"/><path d="M11.10 32.19A1.04 1.04 0 1 0 11.10 34.03" stroke-width="0.24" opacity=".8"/></g><text x="10.20" y="34.00" font-family="Inter, Helvetica, Arial, sans-serif" font-size="2.70" fill="#8d949c" letter-spacing="-.04"><tspan font-weight="700" fill="#7b828a">air</tspan><tspan font-weight="500">gradient</tspan></text>
</svg>
