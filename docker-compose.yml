# Home Air Quality for your home, on a home server or NAS: `docker compose up -d`, then http://localhost:8000.
# DEPLOYMENT.md, "Docker", has the steps. config.toml and .env sit next to this file.
services:
  home-air-quality:
    build: .
    ports:
      # This computer only. To open it to the other devices on your network, use "8000:8000".
      - "127.0.0.1:8000:8000"
    volumes:
      # Your config.toml, read-only. If it's missing, Compose stops with an error instead of creating a folder.
      - type: bind
        source: ./config.toml
        target: /config/config.toml
        read_only: true
        bind:
          create_host_path: false
    env_file:
      # AIRGRADIENT_TOKEN and GOOGLE_POLLEN_API_KEY. Optional, but without a token there are no readings.
      - path: .env
        required: false
    restart: unless-stopped
